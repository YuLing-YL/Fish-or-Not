<body><main class="shell">
  <section class="hero"><div class="brand">钓否 <b>FISH OR NOT</b></div><div class="overview"><div><div class="location" id="place">正在定位…</div><div class="weatherline" id="summary">正在获取当地天气</div></div><div class="score-box"><div class="score" id="topScore">--</div><div class="score-label">综合钓鱼指数</div><div class="verdict" id="verdict">计算中</div></div></div><div class="facts" id="facts"></div></section>

  <section class="panel"><div class="tabs"><button class="tab active" data-water="wild">野钓</button><button class="tab" data-water="pond">鱼塘钓</button></div><div class="head-row"><div><h1 id="sceneTitle">路亚 · 野钓</h1><p id="sceneSub">正在分析目标鱼种</p></div><span class="chip" id="sceneScore">--</span></div><div class="donut-wrap"><div class="donut" id="donut"><div class="donut-center"><b id="bestFish">--</b><strong id="bestPct">--</strong><span>当前最可能咬钩</span></div></div><div><div class="legend" id="legend"></div><p class="fine">相对概率，仅供出钓参考；并非绝对上鱼率。</p><div class="detail" id="detail">点击图例查看该鱼种当前的匹配项。</div></div></div><div class="advice"><h2 id="adviceTitle">出钓建议</h2><p id="adviceText">天气数据加载后生成建议。</p></div><div class="future"><h2>未来 3 天适宜度</h2><div class="days" id="days"></div></div></section><p class="disclaimer">模型使用气压、24 小时气压趋势、气温、湿度、风速、降水、时段与季节的经验加权。水温、溶氧、投喂与实际鱼情未被直接测量，请结合当地水情判断。</p>
</main><script>
// 钓否评分模型：绝对气压 0.35、24h 气压趋势 0.10、气温 0.20、时段 0.10、湿度/风/雨/季节/水域各 0.05；鱼塘将天气影响轻微放宽。
const $=s=>document.querySelector(s);let mode='lure',water='wild',selected='',weather=null,area={province:'',district:'',group:'unknown'};
const colors=['#f38b37','#2284bb','#6a6fd8','#25a981','#e2a928','#dc5b62','#8a68b9'];
// 仅保留常见、非保护、非入侵的可垂钓种。中华鲟/胭脂鱼/松江鲈/哲罗鲑及清道夫等不在任何候选表中。
// 分布白名单：罗非、鲮鱼限华南/滇黔南部；狗鱼限东北或新疆，河鲈限新疆；鳜鱼不在西北高原推荐。
const fish={lure:{wild:[['翘嘴',[15,28],'晨昏'],['鲈鱼',[15,28],'晨昏'],['鳜鱼',[16,28],'晨昏'],['黑鱼',[20,30],'早晚'],['马口',[14,25],'白天'],['鳡鱼',[18,28],'晨昏'],['红尾',[18,29],'晨昏'],['狗鱼',[6,18],'晨昏'],['河鲈',[8,20],'晨昏']],pond:[['鲈鱼',[15,28],'晨昏'],['鳜鱼',[16,28],'晨昏'],['罗非',[22,30],'白天'],['黑鱼',[20,30],'早晚']]},float:{wild:[['鲫鱼',[15,25],'早晚'],['鲤鱼',[15,25],'晨昏'],['草鱼',[18,28],'早晚'],['鲢鳙',[20,30],'白天'],['黄颡鱼',[18,28],'夜间'],['鲶鱼',[20,29],'夜间'],['鳊鱼',[18,28],'早晚'],['罗非',[22,30],'白天'],['鲮鱼',[20,29],'早晚']],pond:[['鲫鱼',[15,25],'早晚'],['鲤鱼',[15,25],'晨昏'],['草鱼',[18,28],'早晚'],['罗非',[22,30],'白天'],['鲢鳙',[20,30],'白天'],['鲮鱼',[20,29],'早晚']]}};
const regionalFish={
 south:new Set(['翘嘴','鲈鱼','鳜鱼','黑鱼','马口','鳡鱼','红尾','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼','罗非','鲮鱼']),
 east:new Set(['翘嘴','鲈鱼','鳜鱼','黑鱼','马口','鳡鱼','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼']),
 north:new Set(['翘嘴','鲈鱼','黑鱼','马口','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼']),
 northeast:new Set(['翘嘴','鲈鱼','鳜鱼','黑鱼','马口','狗鱼','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼']),
 southwest:new Set(['翘嘴','鲈鱼','鳜鱼','黑鱼','马口','鳡鱼','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼']),
 northwest:new Set(['翘嘴','马口','鲫鱼','鲤鱼','草鱼','鲢鳙']),
 xinjiang:new Set(['翘嘴','马口','狗鱼','河鲈','鲫鱼','鲤鱼','草鱼','鲢鳙']),
 unknown:new Set(['翘嘴','黑鱼','马口','鲫鱼','鲤鱼','草鱼','鲢鳙','黄颡鱼','鲶鱼','鳊鱼'])};
function groupFor(province=''){if(/新疆/.test(province))return'xinjiang';if(/辽宁|吉林|黑龙江/.test(province))return'northeast';if(/广东|广西|福建|海南/.test(province))return'south';if(/云南|贵州/.test(province))return'southwest';if(/湖北|湖南|江西|安徽|江苏|浙江|上海|山东/.test(province))return'east';if(/北京|天津|河北|内蒙古/.test(province))return'north';if(/陕西|甘肃|宁夏|青海/.test(province))return'northwest';if(/四川|重庆/.test(province))return'southwest';return'unknown'}
function sceneFish(){let allowed=regionalFish[area.group]||regionalFish.unknown;let list=fish[mode][water].filter(f=>allowed.has(f[0]));return list.length?list:fish[mode][water].filter(f=>regionalFish.unknown.has(f[0]))}
function clamp(n){return Math.max(0,Math.min(1,n))}function bell(n,a,b,fade=8){return n>=a&&n<=b?1:clamp(1-(n<a?a-n:n-b)/fade)}
function wc(code){return code<=1?'晴朗':code<=3?'多云':code<=48?'有雾':code<=67?'有雨':code<=82?'阵雨':'雷暴'}function level(n){return n>=75?['推荐出钓','#16a16d']:n>=50?['一般','#e2a928']:['不建议','#dc5b62']}
function hourFactor(name,h){let night=h<5||h>=20,edge=(h>=5&&h<=8)||(h>=16&&h<=19);if(name==='夜间')return night ? 1 : (edge ? .65 : .35);if(name==='白天')return h>=9&&h<=16 ? 1 : (edge ? .75 : .3);if(name==='早晚'||name==='晨昏')return edge ? 1 : (night ? .55 : .42);return .6}
function factors(f){let c=weather.current, p=weather.pressure, trend=c.pressure-(p[0]??c.pressure), height=weather.elevation||0, shift=height/1000*100;let lo=990-shift,hi=1005-shift;if(f[0]==='鲢鳙'){lo=995-shift;hi=1025-shift}let pressure=bell(c.pressure,lo,hi,15), pt=trend<=-5 ? .05 : (trend>=5 ? 1 : clamp(.55+trend/11)),temp=bell(c.temp,f[1][0],f[1][1],f[0]==='罗非' ? 7 : 9),humidity=bell(c.humidity,50,70,25),wind=bell(c.wind,1.6,3.3,4.5),rain=c.rain===0 ? 1 : (c.rain<1 ? .88 : (c.rain<4 ? .55 : .12)), time=hourFactor(f[2],new Date().getHours()),season=bell((new Date().getMonth()+1),4,10,3),waterF=water==='pond' ? .84 : 1;return {pressure,pt,temp,humidity,wind,rain,time,season,waterF,trend,lo,hi}}
function scoreFish(f){let x=factors(f), pond=water==='pond'; // 鱼塘鱼密度/投喂使极端天气惩罚稍低，仍保留低压闷热风险。
let s=.35*x.pressure+.10*x.pt+.20*x.temp+.10*x.time+.05*x.humidity+.05*x.wind+.05*x.rain+.05*x.season+.05*x.waterF;if(pond)s=.84*s+.16;return {f,score:Math.round(s*100),x}}
function calc(){if(!weather)return;let arr=sceneFish().map(scoreFish).sort((a,b)=>b.score-a.score),sum=arr.reduce((n,x)=>n+x.score,0), top=arr[0];arr.forEach(x=>x.pct=Math.round(x.score/sum*100));let drift=100-arr.reduce((n,x)=>n+x.pct,0);arr[0].pct+=drift;let scene=Math.round(arr.reduce((n,x)=>n+x.score,0)/arr.length);render(arr,scene,top)}
function render(arr,scene,top){let [lab,col]=level(scene);$('#topScore').textContent=scene;$('#topScore').style.color=col;$('#verdict').textContent=lab+' · '+(scene>=75?'窗口不错，注意安全':'结合现场水色与鱼口再决定');$('#sceneScore').textContent=scene+' / 100 · '+lab;$('#sceneScore').style.background=col+'20';$('#sceneScore').style.color=col;$('#sceneTitle').textContent=(mode==='lure'?'路亚':'台钓')+' · '+(water==='wild'?'野钓':'鱼塘钓');$('#sceneSub').textContent='当前最佳目标鱼：'+arr[0].f[0]+'，气压趋势 '+(top.x.trend>=0?'上升':'下降')+' '+Math.abs(top.x.trend).toFixed(1)+' hPa / 24h';$('#bestFish').textContent=arr[0].f[0];$('#bestPct').textContent=arr[0].pct+'%';let pos=0;$('#donut').style.background='conic-gradient('+arr.map((x,i)=>{let st=pos;pos+=x.pct;return `${colors[i]} ${st}% ${pos}%`}).join(',')+')';$('#legend').innerHTML=arr.map((x,i)=>`<button data-i="${i}" class="${x.f[0]===selected?'selected':''}"><i class="dot" style="background:${colors[i]}"></i>${x.f[0]}<span class="pct">${x.pct}%</span></button>`).join('');$('#legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=arr[+b.dataset.i].f[0];showDetail(arr[+b.dataset.i]);calc()});if(!selected||!arr.some(x=>x.f[0]===selected))showDetail(arr[0]);let no=arr[0].pct<25||scene<40;$('#adviceTitle').textContent=no?'当前无明显优势鱼种，不建议出钓':'建议出钓';$('#adviceText').textContent=no?'整体活性偏低，建议等待气压企稳或回升；若已到场，以小钩细线、深浅交替搜寻。':`${arr[0].f[2]}是 ${arr[0].f[0]} 的优先窗口。${weather.current.rain>4?'降水偏强，注意避雨和雷暴风险。':weather.current.wind>8?'风力较大，选择背风岸并谨慎抛投。':'可优先选择有风口、障碍边或进出水区域。'}`;renderDays()}
function showDetail(o){let x=o.x,good=[],bad=[];[['气压',x.pressure],['24h 气压趋势',x.pt],['气温',x.temp],['时段',x.time],['湿度',x.humidity],['风速',x.wind],['降水',x.rain]].forEach(a=>(a[1]>=.7?good:bad).push(a[0]));$('#detail').innerHTML=`<b>${o.f[0]} · ${o.score} 分</b>　最佳气压 ${x.lo.toFixed(0)}–${x.hi.toFixed(0)} hPa；适温 ${o.f[1][0]}–${o.f[1][1]}℃；${o.f[2]}更佳。<br>匹配：${good.join('、')||'暂无'}；需留意：${bad.join('、')||'暂无'}。`}
function renderDays(){let h=weather.hourly, out=[];for(let d=1;d<=3;d++){let start=d*24, rows=h.slice(start,start+24), avg=rows.reduce((n,r)=>n+r.temp,0)/rows.length, p=rows.reduce((n,r)=>n+r.pressure,0)/rows.length, r=rows.reduce((n,r)=>n+r.rain,0),v=Math.round((bell(p,990,1005,15)*.4+bell(avg,15,28,10)*.35+(r<4 ? .25 : .08))*100), date=new Date(rows[0].time);out.push(`<div class="day"><span>${date.getMonth()+1}月${date.getDate()}日 · ${wc(rows[12]?.code||0)}</span><b>${v}</b><span>${avg.toFixed(0)}℃ · 雨 ${r.toFixed(1)}mm</span><div class="meter"><i style="width:${v}%;background:${level(v)[1]}"></i></div></div>`)}$('#days').innerHTML=out.join('')}
async function getWeather(lat,lon,location={}){let label=location.label||`${lat.toFixed(4)}, ${lon.toFixed(4)}`;area={province:location.province||'',district:location.district||'',group:groupFor(location.province)};$('#status').textContent='已定位 '+label+'，正在请求 Open‑Meteo 天气数据…';let u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,precipitation,weather_code&hourly=temperature_2m,pressure_msl,precipitation,weather_code&past_days=1&forecast_days=3&timezone=auto`;let d=await fetch(u).then(r=>{if(!r.ok)throw Error();return r.json()});let a=d.hourly;

let currentAt=new Date(d.current.time).getTime(), idx=a.time.reduce((best,t,i)=>{let at=new Date(t).getTime();return at<=currentAt&&at>=new Date(a.time[best]).getTime()?i:best},0);if(!Number.isFinite(idx)||idx<0)idx=Math.max(0,a.time.length-1);let numeric=(v,fallback=0)=>Number.isFinite(Number(v))?Number(v):fallback, currentPressure=numeric(d.current.pressure_msl,1010);weather={elevation:numeric(d.elevation),current:{temp:numeric(d.current.temperature_2m),humidity:numeric(d.current.relative_humidity_2m,60),pressure:currentPressure,wind:numeric(d.current.wind_speed_10m),rain:numeric(d.current.precipitation),code:numeric(d.current.weather_code)},pressure:a.pressure_msl.slice(Math.max(0,idx-24),idx+1).filter(Number.isFinite),hourly:a.time.map((time,i)=>({time,temp:numeric(a.temperature_2m[i]),pressure:numeric(a.pressure_msl[i],currentPressure),rain:numeric(a.precipitation[i]),code:numeric(a.weather_code[i])}))};$('#place').textContent='⌖ 当前位置：'+label;$('#summary').innerHTML=`<strong>${weather.current.temp.toFixed(0)}℃ · ${wc(weather.current.code)}</strong>体感以当地水情为准`;$('#facts').innerHTML=[['气压',weather.current.pressure.toFixed(0)+' hPa'],['湿度',weather.current.humidity+'%'],['风速',weather.current.wind.toFixed(1)+' m/s'],['降水',weather.current.rain.toFixed(1)+' mm'],['海拔',(d.elevation||0).toFixed(0)+' m']].map(x=>`<div class="fact"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#status').textContent=area.group==='unknown'?'无法确定精确省份，仅显示全国常见鱼种。':'天气已更新：已按 '+(area.province||'所在地区')+' 常见鱼种筛选；海拔已用于气压基准修正。';calc()}
async function reverseLocation(lat,lon){let fallback={label:`${lat.toFixed(4)}, ${lon.toFixed(4)}`};try{let d=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`).then(r=>r.json());let province=d.principalSubdivision||'',district=d.locality||d.city||'',label=[province,district].filter(Boolean).join('');return {label:label||fallback.label,province,district}}catch(e){try{let d=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=zh&count=1`).then(r=>r.json()),x=d.results?.[0];return x?{label:[x.admin1,x.name].filter(Boolean).join(''),province:x.admin1||'',district:x.name||''}:fallback}catch(e){return fallback}}}
async function locate(){try{let p=await new Promise((yes,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(yes,no,{enableHighAccuracy:false,timeout:8000}):no());let {latitude,longitude}=p.coords;getWeather(latitude,longitude,await reverseLocation(latitude,longitude))}catch(e){try{let ip=await fetch('https://ipapi.co/json/').then(r=>r.json());getWeather(ip.latitude,ip.longitude,{label:ip.city||'IP 推测位置',province:ip.region||'',district:ip.city||''});$('#status').textContent='未取得设备定位，已回退为 IP 推测位置；鱼种筛选精度有限。'}catch(e){$('#status').innerHTML='<span class="error">位置未知，请允许定位以获取准确鱼种推荐。</span>';$('#place').textContent='⌖ 位置未知，请允许定位以获取准确鱼种推荐';$('#summary').textContent='需要网络以取得本地天气'}}}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected='';document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));calc()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{water=b.dataset.water;selected='';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));calc()});locate();
