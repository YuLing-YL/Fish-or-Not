async function getWeather(lat,lon,location={}){let label=location.label||`${lat.toFixed(4)}, ${lon.toFixed(4)}`;area={province:location.province||'',district:location.district||'',group:groupFor(location.province)};$('#status').textContent='已定位 '+label+'，正在请求 Open‑Meteo 天气数据…';let u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,precipitation,weather_code&hourly=temperature_2m,pressure_msl,wind_speed_10m,precipitation,weather_code&past_days=1&forecast_days=3&timezone=auto`;let d=await fetch(u).then(r=>{if(!r.ok)throw Error();return r.json()});let a=d.hourly;

function renderAdvice(o){let pond=water==='pond';$('#adviceTitle').textContent=`钓鱼建议 · ${o.f[0]}${selected?'':'（当前推荐）'}`;$('#pondNote').hidden=!pond;$('#adviceGrid').innerHTML=adviceFor(o.f[0]).map(x=>`<article class="advice-item"><b>${x[0]}</b><span>${x[1]}</span></article>`).join('')}
const originalShowDetail=showDetail;showDetail=function(o){originalShowDetail(o);queueMicrotask(()=>renderAdvice(o))};
// conic-gradient 圆环按顺时针从正上方开始，点击角度换算为当前扇区，和图例走同一选中逻辑。
$('#donut').onclick=e=>{if(!lastArr.length)return;let r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)<r.width*.23)return;let angle=(Math.atan2(y,x)*180/Math.PI+450)%360,pos=0,hit=lastArr.find(f=>{pos+=f.pct*3.6;return angle<=pos});if(hit){selected=selected===hit.f[0]?'':hit.f[0];showDetail(selected?hit:lastArr[0]);calc()}};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected='';document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));calc()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{water=b.dataset.water;selected='';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));calc()});$('#windowCard').onclick=()=>$('#windowCard').classList.toggle('open');locate();
</script></body></html>
